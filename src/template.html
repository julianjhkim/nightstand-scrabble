  /* History is paged: one key per 200 games, so the 4000-character limit
     on a single value stops being a ceiling on how much we can keep. */
  const PAGE=40;
  const kURL=k=>'https://'+db.replace(/^https?:\/\//,'').replace(/\/$/,'')+'/g/'+k+'.json';
  async function kGet(k){
    if(!db) return null;
    try{ const r=await fetch(kURL(k),{cache:'no-store'});
      if(!r.ok) return null; const v=await r.json();
      return typeof v==='string'?v:null; }catch(e){ return null; }
  }
  async function kPut(k,v){
    if(!db) return false;
    try{ const r=await fetch(kURL(k),{method:'PUT',body:JSON.stringify(v)}); return r.ok; }
    catch(e){ return false; }
  }
  const clean=v=>(v||'').replace(/[,:|]/g,' ').trim().slice(0,12);
  const Z={B:0,O:0,S:0,W:'',L:0,P:0,F:0,V:''};
  const unpack=g=>{
    if(!g) return {...Z};
    const p=g.split('~');
    const k={B:+p[0]||0,O:+p[1]||0,S:+p[2]||0,W:p[3]||'',L:+p[4]||0,P:+p[5]||0,F:+p[6]||0,V:p[7]||''};
    if(!k.V&&k.W.length===k.L) k.V=k.W;      // older rows only kept the best-scoring word
    return k;
  };
  const pack=k=>[k.B,k.O,k.S,clean(k.W),k.L,k.P,k.F,clean(k.V)].join('~');
  const parsePage=str=>(str||'').split(',').filter(Boolean).map(e=>{
    const p=e.split(':');
    return {t:parseInt(p[0],36)||0,a:+p[1]||0,b:+p[2]||0,n0:p[3]||'',n1:p[4]||'',
            s0:unpack(p[5]),s1:unpack(p[6])};
  });
  /* names are stored with the result, so a later change of seats cannot
     flip who won what */
  const fmtEntry=g=>[b36(g.t),g.a,g.b,clean(g.n0),clean(g.n1),
                     pack(g.s0||Z),pack(g.s1||Z)].join(':');

  const fillNames=g=>{
    const a=clean(g.n0), b=clean(g.n1);
    if(a&&!b&&PEOPLE.includes(a)) return {...g,n1:PEOPLE.find(p=>p!==a)};
    if(b&&!a&&PEOPLE.includes(b)) return {...g,n0:PEOPLE.find(p=>p!==b)};
    return g;
  };
  async function loadHist(){
    const idx=parseInt(await kGet('HIDX')||'0',10)||0;
    const out=[];
    for(let i=0;i<=idx;i++) out.push(...parsePage(await kGet('H'+i)));
    if(!out.length){                      // fold in anything the old single-key version left
      const legacy=await kGet('HISTORY');
      if(legacy){ try{ for(const g of JSON.parse(legacy)) out.push({t:g.t,a:g.a,b:g.b,n0:'',n1:''}); }catch(e){} }
    }
    return out.map(fillNames);
  }
  async function recordGame(){
    if(!db||!S.ended) return;
    const stamp=G.startAt;
    let idx=parseInt(await kGet('HIDX')||'0',10)||0;
    let page=parsePage(await kGet('H'+idx));
    if(!idx&&!page.length){
      const legacy=await kGet('HISTORY');
      if(legacy){ try{ page=JSON.parse(legacy).map(g=>({t:g.t,a:g.a,b:g.b,n0:'',n1:''})); }catch(e){} }
    }
    if(page.some(g=>g.t===stamp)) return;                 // already filed
    if(page.length>=PAGE){ idx++; page=[]; await kPut('HIDX',String(idx)); }
    /* everything the stats screen needs, worked out once from this game's log */
    const k=[{...Z},{...Z}];
    for(const l of S.log){
      if(l.type==='OUT'&&l.turn>=0) k[l.turn].O=1;
      if(l.type!=='P'||l.turn<0) continue;
      const x=k[l.turn]; x.P++;
      if(l.bingo) x.B++;
      const main=(l.words||[]).reduce((p,q)=>q.length>p.length?q:p,'');
      if(main.length>x.L){ x.L=main.length; x.V=main; }
      if(l.score>x.S){ x.S=l.score; x.W=main; }
      const m=missed[l.mi];
      if(m&&m.score<=l.score) x.F++;
    }
    page.push({t:stamp,a:S.scores[0],b:S.scores[1],n0:PEOPLE[0],n1:PEOPLE[1],s0:k[0],s1:k[1]});
    await kPut('H'+idx,page.map(fmtEntry).join(','));
  }
  /* a game only counts towards stats once both players are named and the
     per-game figures are being recorded, which is everything from today on */
  const counted=g=>!!(clean(g.n0)&&clean(g.n1)&&((g.s0&&g.s0.P)||(g.s1&&g.s1.P)));
  const day=ts=>new Date(ts*1000).toLocaleDateString(undefined,{year:'2-digit',month:'short',day:'numeric'});

  async function openSheet(title){
    $('#histSheet').className='sheet on';
    $('#histTitle').textContent=title;
    const el=$('#histList'); el.textContent=t('loading');
    if(!G) G={room:ROOM,level:1,clock:0,
              startAt:0,gameNo:1,first:0,moves:[],_tmp:1};
    me=Math.max(0,PEOPLE.indexOf(myPick));
    const h=await loadHist();
    return {el,h};
  }
  function closeTmp(){ if(G&&G._tmp) G=null; }

  $('#bStats').onclick=async()=>{
    $('#histClear').style.display='none';
    const r=await openSheet(t('stats'));
    const el=r.el, h=r.h.filter(counted);
    if(!h.length){ el.textContent=t('statsnone'); closeTmp(); return; }
    const myName=clean(PEOPLE[me]);
    const mySide=g=>{
      if(g.n0||g.n1){
        if(myName&&clean(g.n0)===myName) return 0;
        if(myName&&clean(g.n1)===myName) return 1;
      }
      return me;
    };
    // fold every stored game into one column per player
    const col=[{w:0,pts:0,n:0,high:0,B:0,O:0,P:0,F:0,bw:null,lw:null},
               {w:0,pts:0,n:0,high:0,B:0,O:0,P:0,F:0,bw:null,lw:null}];
    let drew=0, streak=[0,0], bestStreak=[0,0], run=[0,0];
    for(const g of h){
      const k=mySide(g);
      const sc=[k===0?g.a:g.b, k===0?g.b:g.a];
      const st=[k===0?g.s0:g.s1, k===0?g.s1:g.s0];
      for(const i of [0,1]){
        const c=col[i], x=st[i]||Z;
        c.pts+=sc[i]; c.n++; if(sc[i]>c.high) c.high=sc[i];
        c.B+=x.B; c.O+=x.O; c.P+=x.P; c.F+=x.F;
        if(x.W&&(!c.bw||x.S>c.bw.s)) c.bw={w:x.W,s:x.S,t:g.t};
        if(x.L&&x.V&&(!c.lw||x.L>=c.lw.l)) c.lw={l:x.L,w:x.V,t:g.t};
      }
      if(sc[0]>sc[1]){ col[0].w++; run[0]++; run[1]=0; }
      else if(sc[1]>sc[0]){ col[1].w++; run[1]++; run[0]=0; }
      else { drew++; run=[0,0]; }
      for(const i of [0,1]) if(run[i]>bestStreak[i]) bestStreak[i]=run[i];
    }
    streak=run;
    const num=(v,suf)=>v||v===0?v+(suf||''):t('st_none');
    const row=(label,v0,v1)=>'<div style="display:flex;justify-content:space-between;gap:8px;'
      +'padding:6px 0;border-bottom:1px solid #ffffff0d;font-size:12.5px">'
      +'<span style="color:#8B99BF">'+label+'</span>'
      +'<span style="font-family:Georgia,serif;white-space:nowrap">'
      +'<span style="display:inline-block;min-width:54px;text-align:right">'+v0+'</span>'
      +'<span style="display:inline-block;min-width:54px;text-align:right">'+v1+'</span>'
      +'</span></div>';
    const avg=c=>c.n?Math.round(c.pts/c.n):0;
    const rate=c=>c.P?Math.round(100*c.F/c.P)+'%':t('st_none');
    const head='<div style="display:flex;justify-content:space-between;gap:8px;'
      +'font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5C6A90;'
      +'padding-bottom:7px;border-bottom:1px solid #ffffff22">'
      +'<span>'+h.length+' '+t('gamesplayed')+'</span>'
      +'<span style="white-space:nowrap">'
      +'<span style="display:inline-block;min-width:54px;text-align:right;color:var(--amber)">'+nm(me)+'</span>'
      +'<span style="display:inline-block;min-width:54px;text-align:right">'+nm(1-me)+'</span>'
      +'</span></div>'
      + row(t('st_won'), col[0].w, col[1].w)
      + row(t('st_streak'), streak[0]||t('st_none'), streak[1]||t('st_none'))
      + row(t('st_best'), bestStreak[0], bestStreak[1])
      + row(t('st_avg'), avg(col[0]), avg(col[1]))
      + row(t('st_high'), col[0].high, col[1].high)
      + row(t('st_bingo'), col[0].B, col[1].B)
      + row(t('st_out'), col[0].O, col[1].O)
      + row(t('st_rate'), rate(col[0]), rate(col[1]))
      ;

    const card=(title,pick)=>{
      const got=[0,1].map(i=>pick(col[i]));
      if(!got[0]&&!got[1]) return '';
      const win = got[0]&&got[1] ? (got[0].k>=got[1].k?0:1) : (got[0]?0:1);
      const b=got[win];
      return '<div style="margin-top:14px;background:var(--panel2);border:1px solid var(--line);'
        +'border-radius:10px;padding:10px 12px">'
        +'<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5C6A90;'
        +'margin-bottom:4px">'+title+'</div>'
        +'<div><span class="wchip" style="margin:0" data-w="'+b.w+'">'+b.w+'</span>'
        +'<span style="font-size:12px;color:#8B99BF;margin-left:8px">'+b.sub
        +' \u00b7 '+nm(win===0?me:1-me)+' \u00b7 '+day(b.t)+'</span></div></div>';
    };
    const bwPick=c=>c.bw?{k:c.bw.s,w:c.bw.w,sub:c.bw.s+t('pts'),t:c.bw.t}:null;
    const lwPick=c=>c.lw?{k:c.lw.l,w:c.lw.w,sub:c.lw.l+' '+t('st_letters'),t:c.lw.t}:null;
    const cards=card(t('st_bw'),bwPick)+card(t('st_lw'),lwPick);
    el.innerHTML=head+cards;
    el.querySelectorAll('.wchip[data-w]').forEach(c=>c.onclick=()=>{
      $('#histSheet').className='sheet';
      $('#wordSheet').className='sheet on';
      $('#wordList').innerHTML=''; lookup(c.dataset.w);
    });
    closeTmp();
  };

  $('#bHist').onclick=async()=>{
    $('#histClear').style.display='';
    const {el,h}=await openSheet(t('histtitle'));
    if(!h.length){ el.textContent=t('histnone'); closeTmp(); return; }
    el.innerHTML=h.slice().reverse().map(g=>{
      const l0=clean(g.n0)||t('seat1'), l1=clean(g.n1)||t('seat2');
      const side=(n,sc,win)=>'<span style="'+(win?'color:#E7ECF7;font-weight:600':'color:#8B99BF')+'">'
        +n+' '+sc+'</span>';
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;'
        +'border-bottom:1px solid #ffffff10;font-size:13px">'
        +'<span style="color:#5C6A90;white-space:nowrap">'+day(g.t)+'</span>'
        +'<span style="text-align:right">'+side(l0,g.a,g.a>g.b)+'<span style="color:#5C6A90"> : </span>'
        +side(l1,g.b,g.b>g.a)+'</span></div>';
    }).join('');
    closeTmp();
  };

  $('#histClear').onclick=async()=>{
    if(!confirm(t('histclearask'))) return;
    const idx=parseInt(await kGet('HIDX')||'0',10)||0;
    for(let i=0;i<=idx;i++) await kPut('H'+i,'');
    await kPut('HIDX','0'); await kPut('HISTORY','');
    $('#histList').textContent=t('histnone');
  };
  $('#histClose').onclick=()=>$('#histSheet').className='sheet';

  $('#bWords').onclick=()=>{
    $('#wordSheet').className='sheet on';
    const list=$('#wordList'); list.innerHTML=''; $('#def').textContent=t('tapword');
    const seen=new Set();
    for(const l of S.log){
      if(l.type!=='P') continue;
      for(const w of l.words){
        if(seen.has(w)) continue; seen.add(w);
        const b=document.createElement('span');
        b.className='wchip'+(l.turn===me?'':' them');
        b.innerHTML=w+'<small>'+nm(l.turn)+'</small>';
        b.onclick=()=>lookup(w); list.appendChild(b);
      }
    }
    if(!seen.size) list.textContent='No words yet.';
    const rows=[];
    for(const l of S.log){
      if(l.type!=='P') continue;
      const m=missed[l.mi];
      if(m&&m.words&&m.words.length&&m.score>l.score) rows.push({m,turn:l.turn});
    }
    if(rows.length){
      const h=document.createElement('div');
      h.style.cssText='margin-top:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8B99BF';
      h.textContent=t('missed'); list.appendChild(h);
      const note=document.createElement('div');
      note.style.cssText='font-size:11px;color:#5C6A90;margin:4px 0 8px';
      note.textContent=t('missednote'); list.appendChild(note);
      const wrap=document.createElement('div'); wrap.style.marginTop='2px';
      const done=new Set();
      for(const {m,turn} of rows){
        const hide=!S.ended&&stillOpen(m,S,turn,dict);
        for(const w of m.words){
          const key=w+turn;
          if(done.has(key))continue; done.add(key);
          const b=document.createElement('span');
          if(hide){
            b.className='wchip locked';
            b.innerHTML='<span class="bx">'+'\u25A1'.repeat(w.length)+'</span><small>'+m.score+'</small>';
          }else{
            b.className='wchip'+(turn===me?'':' them');
            b.innerHTML=w+'<small>'+m.score+'</small>';
            b.onclick=()=>lookup(w);
          }
          wrap.appendChild(b);
        }
      }
      list.appendChild(wrap);
    }
  };
  $('#wordClose').onclick=()=>$('#wordSheet').className='sheet';

  async function lookup(w){
    const d=$('#def'), key=w.toLowerCase();
    if(defCache[key]){d.innerHTML=defCache[key];return;}
    const head='<div style="font-family:Georgia,serif;font-size:17px;margin-bottom:6px">'+w+'</div>';
    const loc=localDef(w);
    let html=head;
    if(loc){
      const [pos,def,ex]=loc.e;
      if(GEODEF[w.toLowerCase()]&&!DEFS[w.toLowerCase()]) html+='';
      if(loc.ko) html+='<div class="ko">'+loc.ko.join(' · ')+'</div>';
      html+='<div style="margin-bottom:8px"><span class="pos">'+pos+'</span><br>'+def
        +(ex?'<br><span class="ex">\u201C'+ex+'\u201D</span>':'')
        +(loc.lemma!==key?'<br><span class="ex" style="font-size:11px">from '+loc.lemma+'</span>':'')
        +'</div>';
      d.innerHTML=html;
    } else {
      const k=localKo(w);
      if(k){ html+='<div class="ko">'+k.join(' · ')+'</div>'; d.innerHTML=html; }
      else d.textContent=t('loading');
    }
    try{
      const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key));
      if(!r.ok) throw 0;
      const j=await r.json();
      let more='',n=0;
      for(const entry of j) for(const m of (entry.meanings||[])){
        for(const def of (m.definitions||[]).slice(0,1)){
          if(n++>=2) break;
          more+='<div style="margin-bottom:8px"><span class="pos">'+(m.partOfSpeech||'')+'</span><br>'
            +def.definition+(def.example?'<br><span class="ex">\u201C'+def.example+'\u201D</span>':'')+'</div>';
        }
      }
      if(more) html+='<div style="border-top:1px solid #2C3960;margin:10px 0 8px"></div>'+more;
    }catch(e){ if(!loc) html+='<div class="ex">'+t('nodef')+'</div>'; }
    defCache[key]=html; d.innerHTML=html;
  }

  /* ---- deep link ---- */
  (function(){
    const h=new URLSearchParams(location.hash.replace(/^#/,''));
    if(h.get('db')) db=h.get('db');
    if(h.get('cl')!==null){
      clockSel=+h.get('cl');
      const btns=[...document.querySelectorAll('#clockSeg button')];
      btns.forEach(x=>x.classList.remove('on'));
      const exact=btns.find(x=>+x.dataset.cl===clockSel);
      if(exact) exact.classList.add('on');
      else{ const c=btns.find(x=>x.dataset.cl==='-1');
            c.textContent=Math.round(clockSel/60)+' min'; c.classList.add('on'); }
    }
    try{ myPick=localStorage.getItem('nsb_name')||''; }catch(e){}
    document.querySelectorAll('#nameSeg button').forEach(b=>b.classList.toggle('on',b.dataset.nm===myPick));
    me=Math.max(0,PEOPLE.indexOf(myPick));
    readyCheck();
    let cfg=null; try{ cfg=JSON.parse(localStorage.getItem('nsb_cfg')||'null'); }catch(e){}
    if(cfg&&cfg.clock!==undefined){
      // remember everything, but still show the screen: the seat is chosen here
      clockSel=cfg.clock;
      const btns=[...document.querySelectorAll('#clockSeg button')];
      btns.forEach(x=>x.classList.remove('on'));
      const exact=btns.find(x=>+x.dataset.cl===clockSel);
      if(exact) exact.classList.add('on');
      else if(clockSel>0){ const c=btns.find(x=>x.dataset.cl==='-1');
        c.textContent=Math.round(clockSel/60)+' min'; c.classList.add('on'); }
    }
  })();

  async function showLastGame(){
    if(!db) return;
    const room=ROOM;
    const keep=G;
    G={room,level:0,clock:0,startAt:0,gameNo:1,first:0,moves:[],_tmp:1};
    const h=await loadHist();
    G=keep;
    if(!h.length) return;
    const g=h[h.length-1];
    const l0=clean(g.n0)||t('seat1'), l1=clean(g.n1)||t('seat2');
    const win=g.a===g.b?null:(g.a>g.b?l0:l1);
    const day=new Date(g.t*1000).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    $('#lastGame').innerHTML='<div class="lg">'+t('lastgame')+' \u00b7 '+day+'</div>'
      +(win?'<b>'+win+'</b> '+t('won')+' ':'<b>'+t('draw')+'</b> ')
      +'<span style="font-family:Georgia,serif">'+Math.max(g.a,g.b)+' : '+Math.min(g.a,g.b)+'</span>';
    $('#lastGame').className='on';
  }
  showLastGame();

  paintLang();
})();
</script>
</body>
